buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'checkstyle'

version = '1.2'
group = 'com.pavel.ironcore'
archivesBaseName = 'ironcore'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                ironcore {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                ironcore {
                    source sourceSets.main
                }
            }
        }
        
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'ironcore', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                ironcore {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation 'software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "ironcore",
                "Specification-Vendor"    : "pavel",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "pavel",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

// ── Checkstyle (статический анализ Java) ─────────────────────────────────────
checkstyle {
    toolVersion = '10.12.0'
    configFile   = file('config/checkstyle/checkstyle.xml')
    // ignoreFailures: сборка не падает при нарушениях — только выводит отчёт.
    // Для КТ №3 (code freeze) нарушений быть не должно.
    ignoreFailures = true
    showViolations = true
}

